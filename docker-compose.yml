services:
  backend:
    build:
      context: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      PORT: "8080"
      BACKEND_ORIGIN: "http://backend:8080"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./frontend/llm:/usr/share/nginx/html/llm:ro
      - ./frontend/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:8080"
