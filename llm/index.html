<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>How LLMs Work — pdlawson.com</title>
    <link rel="stylesheet" href="/style.css">
    <style>
      h2 { margin-top: 48px; }

      /* Tokeniser */
      .tokeniser textarea {
        width: 100%;
        height: 100px;
        padding: 10px;
        font-size: 1em;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
      }
      .tokeniser button {
        margin-top: 10px;
        padding: 8px 20px;
        font-size: 1em;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        background: #1a0dab;
        color: #fff;
      }
      .tokeniser button:hover { background: #1507a0; }
      .tokeniser button:disabled { background: #888; cursor: default; }

      #token-output {
        margin-top: 20px;
        min-height: 40px;
      }
      #token-count {
        margin-top: 10px;
        font-size: 0.9em;
        color: #555;
      }
      .token {
        display: inline-block;
        padding: 2px 0;
        font-family: monospace;
        font-size: 1em;
        white-space: pre;
        border-radius: 3px;
      }
      .status { color: #555; font-style: italic; }
      .error { color: #c00; }
    </style>
  </head>
  <body>
    <h1>How LLMs Work</h1>
    <p>An explanation and interactive demonstration of how large language models work.</p>

    <h2>Tokenisation</h2>
    <p>
      LLMs don't read text character by character. Instead, they break it into
      <em>tokens</em> — chunks that are roughly a word or word-fragment. Try it below.
    </p>

    <div class="tokeniser">
      <textarea id="token-input" placeholder="Enter some text…"></textarea>
      <br>
      <button id="token-btn" onclick="tokenise()">Tokenise</button>
      <div id="token-output"></div>
      <div id="token-count"></div>
    </div>

    <p class="back"><a href="/">← Back to home</a></p>

    <script type="module" src="/llm/llm.js"></script>
  </body>
</html>
