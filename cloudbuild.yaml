substitutions:
  _REGION: europe-west1
  _BACKEND_SERVICE: homepage-backend
  _FRONTEND_SERVICE: homepage-frontend
  _BACKEND_ORIGIN: https://api.pdlawson.com

steps:
  - id: pull-backend-cache
    name: gcr.io/cloud-builders/docker
    waitFor:
      - "-"
    entrypoint: bash
    args:
      - -c
      - docker pull gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest || exit 0

  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - pull-backend-cache
    dir: backend
    args:
      - build
      - --cache-from=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest
      - -t=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}
      - -t=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest
      - .

  - id: pull-frontend-cache
    name: gcr.io/cloud-builders/docker
    waitFor:
      - "-"
    entrypoint: bash
    args:
      - -c
      - docker pull gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest || exit 0

  - id: build-frontend-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - pull-frontend-cache
    dir: frontend
    args:
      - build
      - --cache-from=gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest
      - -t=gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA}
      - -t=gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest
      - .

  - id: push-backend-commit-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-backend-image
    args:
      - push
      - gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}

  - id: push-backend-latest-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-backend-image
    args:
      - push
      - gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:latest

  - id: push-frontend-commit-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-frontend-image
    args:
      - push
      - gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA}

  - id: push-frontend-latest-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-frontend-image
    args:
      - push
      - gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:latest

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor:
      - push-backend-commit-image
    args:
      - gcloud
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --project=${PROJECT_ID}
      - --image=gcr.io/${PROJECT_ID}/${_BACKEND_SERVICE}:${SHORT_SHA}
      - --platform=managed
      - --region=${_REGION}
      - --allow-unauthenticated

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor:
      - push-frontend-commit-image
      - deploy-backend
    args:
      - gcloud
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --project=${PROJECT_ID}
      - --image=gcr.io/${PROJECT_ID}/${_FRONTEND_SERVICE}:${SHORT_SHA}
      - --platform=managed
      - --region=${_REGION}
      - --allow-unauthenticated
      - --set-env-vars=BACKEND_ORIGIN=${_BACKEND_ORIGIN}
