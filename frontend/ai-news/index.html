<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI News — pdlawson.com</title>
    <link rel="stylesheet" href="/style.css">
    <style>
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 24px 0;
      }
      .filters button {
        border: 1px solid #ccc;
        background: #fff;
        padding: 4px 12px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 0.85em;
        color: #555;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .filters button:hover { border-color: #888; }
      .filters button.active {
        background: #1a0dab;
        border-color: #1a0dab;
        color: #fff;
      }
      .article { margin-bottom: 24px; }
      .article-title {
        font-size: 1.1em;
        font-weight: bold;
        text-decoration: none;
      }
      .article-title:hover { text-decoration: underline; }
      .article-meta {
        margin: 4px 0 0;
        color: #555;
        font-size: 0.9em;
      }
      .article-tags { display: inline; }
      .tag {
        display: inline-block;
        background: #eee;
        color: #555;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 0.8em;
        margin-left: 6px;
      }
      #no-results {
        display: none;
        color: #888;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <h1>AI News</h1>
    <p>Recent news from the world of AI.</p>
    <div class="filters" id="filters"></div>
    <div id="articles"></div>
    <p id="no-results">No articles match the selected filters.</p>
    <p class="back"><a href="/">← Home</a></p>
    <script type="module">
      const ALL_TAGS = ['Product Launch', 'Agents', 'Developer Tools', 'Enterprise', 'Case Study', 'Opinion'];
      let activeTags = new Set();
      let articles = [];

      const filtersEl = document.getElementById('filters');
      const articlesEl = document.getElementById('articles');
      const noResultsEl = document.getElementById('no-results');

      ALL_TAGS.forEach(tag => {
        const btn = document.createElement('button');
        btn.textContent = tag;
        btn.addEventListener('click', () => {
          if (activeTags.has(tag)) {
            activeTags.delete(tag);
            btn.classList.remove('active');
          } else {
            activeTags.add(tag);
            btn.classList.add('active');
          }
          render();
        });
        filtersEl.appendChild(btn);
      });

      function formatDate(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function render() {
        const filtered = activeTags.size === 0
          ? articles
          : articles.filter(a => a.tags.some(t => activeTags.has(t)));

        articlesEl.innerHTML = '';
        noResultsEl.style.display = filtered.length === 0 ? 'block' : 'none';

        filtered.forEach(a => {
          const div = document.createElement('div');
          div.className = 'article';

          const link = document.createElement('a');
          link.className = 'article-title';
          link.href = a.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = a.title;

          const meta = document.createElement('p');
          meta.className = 'article-meta';
          meta.textContent = `${formatDate(a.date)} · ${a.source}`;

          const tagsSpan = document.createElement('span');
          tagsSpan.className = 'article-tags';
          a.tags.forEach(t => {
            const pill = document.createElement('span');
            pill.className = 'tag';
            pill.textContent = t;
            tagsSpan.appendChild(pill);
          });
          meta.appendChild(tagsSpan);

          div.appendChild(link);
          div.appendChild(meta);
          articlesEl.appendChild(div);
        });
      }

      fetch('news.json')
        .then(r => r.json())
        .then(data => { articles = data; render(); });
    </script>
  </body>
</html>
